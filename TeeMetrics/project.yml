name: TeeMetrics
options:
  bundleIdPrefix: com.teemetrics.app
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TeeMetrics:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TeeMetrics
        excludes:
          - "**/.DS_Store"
          - "Widgets/**"
    resources:
      - TeeMetrics/Resources/Assets.xcassets
      - TeeMetrics/Resources/courses.json
    info:
      path: TeeMetrics/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemetrics.app.TeeMetrics
        INFOPLIST_FILE: TeeMetrics/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: TeeMetrics/TeeMetrics.entitlements
    entitlements:
      path: TeeMetrics/TeeMetrics.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.teemetrics.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.teemetrics.shared
    dependencies:
      - target: TeeMetricsWidgets
      - target: TeeMetricsWatch

  TeeMetricsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TeeMetrics/Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemetrics.app.TeeMetrics.TeeMetricsWidgets
        INFOPLIST_KEY_CFBundleDisplayName: TeeMetrics
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: TeeMetrics/TeeMetricsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.teemetrics.shared

  TeeMetricsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - TeeMetricsWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teemetrics.app.TeeMetrics.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.teemetrics.app.TeeMetrics

schemes:
  TeeMetrics:
    build:
      targets:
        TeeMetrics: all
        TeeMetricsWidgets: all
        TeeMetricsWatch: all
    run:
      config: Debug
    archive:
      config: Release
